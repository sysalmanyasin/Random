name: Build Individual Rounds Widget APK

on:
  push:
    branches: [ main ]
    paths:
      - 'AuditWidget/**'
      - '.github/workflows/build-widget-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AuditWidget
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        # Uses the Supabase URL/anon key already baked into app/build.gradle.kts.
        # To point at a different project instead, add SUPABASE_URL and
        # SUPABASE_ANON_KEY as repo secrets, then reintroduce an `env:` block
        # here passing them as ORG_GRADLE_PROJECT_supabaseUrl / ...AnonKey —
        # app/build.gradle.kts already falls back to the baked-in defaults if
        # either property comes through blank.
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: audit-rounds-widget-debug-apk
          path: AuditWidget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
