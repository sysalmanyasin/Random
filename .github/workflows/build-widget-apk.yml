name: Build Individual Rounds Widget APK

on:
  push:
    branches: [ main ]
    paths:
      - 'AuditWidget/**'
      - '.github/workflows/build-widget-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AuditWidget
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
        env:
          # Optional overrides — set these as repo Actions secrets if you ever
          # want the built APK to point at a different Supabase project.
          # Falls back to the values already baked into app/build.gradle.kts.
          ORG_GRADLE_PROJECT_supabaseUrl: ${{ secrets.SUPABASE_URL }}
          ORG_GRADLE_PROJECT_supabaseAnonKey: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: audit-rounds-widget-debug-apk
          path: AuditWidget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
